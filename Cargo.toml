[package]
name = "cocos4-rust"
version = "0.1.0"
edition = "2021"
authors = ["Cocos Team"]
description = "Rust implementation of Cocos4 game engine"
license = "MIT"
repository = "https://github.com/cocos/cocos4-rust"
readme = "README.md"

[features]
default = [
    "std",
    "gfx-empty",
    "gfx-validator",
    "gfx-wgpu",
    "gfx-agent",
    "pipeline-custom",
    "pipeline-deferred",
    "physics-2d",
    "network-real",
    "platform-real",
    "storage-disk",
    "dragon-bones",
    "spine",
    "js-bindings",
    "terrain",
    "tiled-map",
]
std = []
gfx-empty = []
gfx-validator = []
gfx-wgpu = []
gfx-agent = []
pipeline-custom = []
pipeline-deferred = []
physics-2d = []
network-real = []
platform-real = []
storage-disk = []
dragon-bones = []
spine = []
js-bindings = []
terrain = []
tiled-map = []
js-runtime-probe = []
js-runtime-mock = []
js-runtime-real = ["boa_engine", "serde_json"]

[dependencies]
bitflags = "2"
rand = "0.8"
lazy_static = "1.4"
boa_engine = { version = "0.20", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
