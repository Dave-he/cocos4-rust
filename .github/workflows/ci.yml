name: CI

# ----------------------------------------------------------------------------
# Build pipeline: Bazel + BuildBuddy remote cache.
# Slug: EGDoGaZis5ZMKN4P4TtB  (https://app.buildbuddy.io/)
# Secret: BUILDBUDDY_API_KEY must be set in the repository or org secrets.
# ----------------------------------------------------------------------------

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # BES results URL is reconstructed by BuildBuddy at the end of each run.
  BUILDBUDDY_ORG: EGDoGaZis5ZMKN4P4TtB

jobs:
  bazel:
    name: Bazel build & test (BuildBuddy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          set -euo pipefail
          BAZELISK_VERSION="${BAZELISK_VERSION:-v1.29.0}"
          BAZELISK_OS="linux"
          BAZELISK_ARCH="amd64"
          URL="https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-${BAZELISK_OS}-${BAZELISK_ARCH}"
          echo "Downloading ${URL}"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
               -o /usr/local/bin/bazel "${URL}"
          chmod +x /usr/local/bin/bazel
          /usr/local/bin/bazel --version

      - name: Show toolchain info
        run: |
          bazel --version
          bazel info release
          rustc --version
          cargo --version

      - name: Cache Bazel repository cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            /tmp/bazel-repo-cache
          key: ${{ runner.os }}-bazel-repo-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-repo-

      - name: Cache Bazel execution root
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel/_bazel_${{ runner.user }}/install
          key: ${{ runner.os }}-bazel-install-${{ hashFiles('.bazelversion') }}
          restore-keys: |
            ${{ runner.os }}-bazel-install-

      - name: Resolve module dependencies
        run: bazel mod deps --output=text

      - name: Build (debug)
        run: bazel build //... --config=ci

      - name: Build (release)
        run: bazel build //:cocos4-rust --config=ci -c opt

      - name: Test (debug)
        run: bazel test //:all_tests --config=ci --test_output=errors

      - name: Run demo binary
        run: bazel run //:cocos4-rust --config=ci

      - name: Run quaternion demo
        run: bazel run //:quaternion_demo --config=ci

      - name: Upload BuildBuddy invocation link
        if: always()
        env:
          BUILDBUDDY_ORG_SLUG: ${{ env.BUILDBUDDY_ORG }}
        run: |
          {
            printf '## 🔗 BuildBuddy\n\n'
            printf 'Open the org dashboard for org `%s`:\n' "${BUILDBUDDY_ORG_SLUG}"
            printf '<https://app.buildbuddy.io/%s/>\n\n' "${BUILDBUDDY_ORG_SLUG}"
            printf 'Once BES upload finishes, the direct invocation link is in the `BuildBuddy` step log (BuildBuddy prints it via `--bes_results_url`).\n'
          } >> "$GITHUB_STEP_SUMMARY"

  format:
    name: cargo fmt (regression guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (regression guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings

  cargo-test:
    name: cargo test (regression guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --verbose --all-features -- --test-threads=4

  coverage:
    name: Code coverage (cargo llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          fail_ci_if_error: false

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions-rs/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
