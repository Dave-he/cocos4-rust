name: CI

# ----------------------------------------------------------------------------
# Build pipeline: Bazel + BuildBuddy remote cache.
# Slug: EGDoGaZis5ZMKN4P4TtB  (https://app.buildbuddy.io/)
# Secret: BUILDBUDDY_API_KEY must be set in the repository or org secrets.
# ----------------------------------------------------------------------------

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # BES results URL is reconstructed by BuildBuddy at the end of each run.
  BUILDBUDDY_ORG: EGDoGaZis5ZMKN4P4TtB

jobs:
  bazel:
    name: Bazel build & test (BuildBuddy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          set -euo pipefail
          BAZELISK_VERSION="${BAZELISK_VERSION:-v1.29.0}"
          BAZELISK_OS="linux"
          BAZELISK_ARCH="amd64"
          URL="https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-${BAZELISK_OS}-${BAZELISK_ARCH}"
          echo "Downloading ${URL}"
          mkdir -p "${HOME}/bin"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
               -o "${HOME}/bin/bazel" "${URL}"
          chmod +x "${HOME}/bin/bazel"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
          bazel --version

      - name: Show toolchain info
        run: |
          bazel --version
          bazel info release
          rustc --version
          cargo --version

      - name: Cache Bazel repository cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            /tmp/bazel-repo-cache
          key: ${{ runner.os }}-bazel-repo-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-repo-

      - name: Cache Bazel execution root
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel/_bazel_${{ runner.user }}/install
          key: ${{ runner.os }}-bazel-install-${{ hashFiles('.bazelversion') }}
          restore-keys: |
            ${{ runner.os }}-bazel-install-

      - name: Resolve module dependencies
        run: bazel mod deps --output=text

      - name: Build (debug)
        run: |
          bazel build //... \
            --config=ci \
            --bes_header="x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" \
            --remote_header="x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"

      - name: Build (release)
        run: |
          bazel build //:cocos4-rust \
            --config=ci -c opt \
            --bes_header="x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" \
            --remote_header="x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"

      - name: Test (debug)
        run: |
          bazel test //:all_tests \
            --config=ci --test_output=errors \
            --bes_header="x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" \
            --remote_header="x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"

      - name: Run demo binary
        run: |
          bazel run //:cocos4-rust \
            --config=ci \
            --bes_header="x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" \
            --remote_header="x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"

      - name: Run quaternion demo
        run: |
          bazel run //:quaternion_demo \
            --config=ci \
            --bes_header="x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" \
            --remote_header="x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"

      - name: Upload BuildBuddy invocation link
        if: always()
        env:
          BUILDBUDDY_ORG_SLUG: ${{ env.BUILDBUDDY_ORG }}
        run: |
          {
            printf '## 🔗 BuildBuddy\n\n'
            printf 'Open the org dashboard for org `%s`:\n' "${BUILDBUDDY_ORG_SLUG}"
            printf '<https://app.buildbuddy.io/%s/>\n\n' "${BUILDBUDDY_ORG_SLUG}"
            printf 'Once BES upload finishes, the direct invocation link is in the `BuildBuddy` step log (BuildBuddy prints it via `--bes_results_url`).\n'
          } >> "$GITHUB_STEP_SUMMARY"

  format:
    name: cargo fmt (regression guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (regression guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Same feature set as the Bazel job (default features) and the
      # lib's own `cargo check`. The pre-existing clippy style warnings
      # are NOT blockers for the build — they are style hints that the
      # project has not yet opted into. Promote individual warnings to
      # errors incrementally with `cargo clippy -- -D clippy::<name>`
      # instead of blanket `-D warnings`, which would never go green.
      # The `[lints.clippy]` table in Cargo.toml is the source of truth
      # for which lints are currently `deny`; today that's just
      # `clippy::double_ended_iterator_last` (the perf lint we fixed in
      # src/core/utils/id_generator.rs).
      - run: cargo clippy --all-targets --no-deps

  clippy-strict:
    # Incremental lint enforcement: this job promotes one (or a small
    # batch of) clippy lints from `warn` to `deny` on a per-PR basis.
    # The list below mirrors the candidate set in Cargo.toml's
    # `[lints.clippy]` table. Promoting a lint is a two-step ritual:
    #   1. Add the lint to the `-- -D clippy::<name>` list here.
    #   2. Fix the resulting errors, commit, push.
    # Once a lint is promoted and the tree is clean, the entry can be
    # moved into Cargo.toml's `[lints.clippy]` table as `deny` (and
    # removed from the CLI flag list here, to keep this job focused on
    # the next candidate). The job runs with continue-on-error so a
    # failing promotion doesn't take down the whole suite — it surfaces
    # as a noisy red check on the PR and a clear signal that more
    # fixes are needed before the lint can graduate.
    name: cargo clippy -- -D clippy::perf (incremental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Promote a single perf-group lint as the canonical example of the
      # incremental rollout. Add more `-- -D clippy::<name>` flags as
      # lints graduate from the [lints.clippy] warn set to deny.
      - run: cargo clippy --all-targets --no-deps -- -D clippy::perf

  cargo-test:
    name: cargo test (regression guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --verbose --all-features -- --test-threads=4

  coverage:
    name: Code coverage (cargo llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          fail_ci_if_error: false

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # actions-rs/audit-check@v2 was retired by upstream and now fails
      # with "unable to find version v2". Run cargo-audit directly via
      # cargo-binstall or by invoking the cargo-audit subcommand if
      # installed; otherwise install via cargo install. The action just
      # shells out to `cargo audit --deny warnings` and exits non-zero
      # on any known vulnerability in the dependency graph.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        # cargo-audit < 0.22 doesn't parse CVSS 4.0 advisories and the
        # latest RustSec DB now ships them; bumping to ^0.22 makes the
        # audit runnable again.
        run: cargo install --locked cargo-audit --version "^0.22"
      - name: Run cargo audit
        # RUSTSEC-2024-0436: `paste` is unmaintained but has no code
        # vulnerability. It is a transitive dep of some proc-macro
        # in our tree, and the recommended drop-in (`pastey`) requires
        # editing Cargo.lock by hand. Track in a follow-up; for now
        # treat as informational and let the audit pass.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436
